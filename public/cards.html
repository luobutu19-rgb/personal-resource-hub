<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>记忆卡片 · 我的资源站</title>
  <meta name="theme-color" content="#FAF9F6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css?v=20261107j">
  <script src="/js/theme-sync.js"></script>
  <script src="/js/monet.js"></script>
  <style>
    .cards-shell {
      max-width: 1200px;
      margin: 0 auto;
      padding: calc(18px + env(safe-area-inset-top)) 20px calc(48px + env(safe-area-inset-bottom));
    }

    .cards-top {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .cards-title {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .cards-title h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .cards-title p { font-size: 11.5px; color: var(--ink-3); }

    .top-stats {
      display: flex;
      gap: 8px;
      margin-left: auto;
      flex-wrap: wrap;
    }
    .stat-chip {
      display: inline-flex;
      align-items: baseline;
      gap: 5px;
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--bg-elev);
      font-size: 11px;
      color: var(--ink-3);
      box-shadow: var(--md-elev-1, var(--shadow-sm));
    }
    .stat-chip b {
      font-size: 15px;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    .stat-chip.due b { color: #c2733f; }

    .cards-grid {
      display: grid;
      grid-template-columns: 232px minmax(0, 1fr);
      gap: 18px;
      margin-top: 18px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--bg-elev);
      box-shadow: var(--md-elev-1, var(--shadow-sm));
    }

    .decks { padding: 14px; position: sticky; top: 16px; }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 2px 10px;
    }
    .panel-head strong { font-size: 12px; letter-spacing: 0.04em; color: var(--ink-3); font-weight: 650; }

    .deck-item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 8px 12px;
      border: 0;
      border-radius: 999px;
      background: none;
      color: var(--ink-2);
      font-size: 13px;
      text-align: left;
      transition: background-color 0.24s var(--md-ease), color 0.24s var(--md-ease);
    }
    .deck-item:hover { background: var(--bg-soft); color: var(--ink); }
    .deck-item.active { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
    .deck-item .deck-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .deck-item .deck-count {
      font-size: 10.5px;
      color: var(--ink-3);
      font-variant-numeric: tabular-nums;
    }
    .deck-item.active .deck-count { color: var(--accent-ink); }
    .deck-item .deck-due {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #c2733f;
      flex: none;
    }

    .deck-empty { padding: 8px 10px; font-size: 11.5px; color: var(--ink-3); }

    .deck-foot { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
    .deck-foot button {
      width: 100%;
      height: 34px;
      border: 1px dashed var(--line-strong);
      border-radius: 10px;
      background: none;
      color: var(--ink-2);
      font-size: 12px;
    }
    .deck-foot button:hover { border-color: var(--accent); color: var(--accent-ink); }

    .main-col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

    .ai-panel {
      position: relative;
      padding: 16px;
      border-radius: 24px;
      border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--line));
      background:
        radial-gradient(600px 200px at 0% -20%, var(--accent-glow), transparent 70%),
        var(--bg-elev);
      box-shadow: var(--md-elev-1, var(--shadow-sm));
    }
    .ai-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .ai-head .eyebrow {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent-ink);
      font-weight: 700;
    }
    .ai-head h2 { font-size: 15px; font-weight: 650; }

    .ai-input {
      width: 100%;
      min-height: 118px;
      max-height: 320px;
      resize: vertical;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--bg);
      color: var(--ink);
      font-size: 13.5px;
      line-height: 1.65;
      outline: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }
    .ai-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .ai-input::placeholder { color: var(--ink-3); }

    .ai-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .mini-field {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--bg);
      font-size: 12px;
      color: var(--ink-3);
    }
    .mini-field select,
    .mini-field input {
      border: 0;
      background: none;
      color: var(--ink);
      font-size: 12.5px;
      outline: none;
      max-width: 130px;
    }

    .ai-actions { margin-left: auto; display: flex; gap: 8px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 38px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--bg-elev);
      color: var(--ink-2);
      font-size: 12.5px;
      font-weight: 500;
      transition:
        background-color 0.24s var(--md-ease),
        border-color 0.24s var(--md-ease),
        color 0.24s var(--md-ease),
        box-shadow 0.24s var(--md-ease),
        transform 0.14s var(--md-ease);
    }
    .btn:hover { border-color: var(--line-strong); color: var(--ink); }
    .btn:active { transform: scale(0.97); }
    .btn .icon { width: 15px; height: 15px; }
    .btn.primary {
      border-color: transparent;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      box-shadow: var(--md-elev-1, 0 10px 24px -12px var(--accent));
    }
    .btn.primary:hover { filter: none; color: #fff; box-shadow: var(--md-elev-2, var(--shadow-md)); }
    .btn:disabled { opacity: 0.55; cursor: default; }
    .btn.ghost { background: none; }
    .btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 30%, var(--line)); }

    .ai-hint { margin-top: 9px; font-size: 11px; color: var(--ink-3); line-height: 1.6; }
    .ai-hint a { color: var(--accent-ink); }

    .list-panel { padding: 14px 14px 18px; }
    .list-head {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 0 2px 10px;
    }
    .list-head h2 { font-size: 15px; font-weight: 650; }
    .list-head .count { font-size: 11px; color: var(--ink-3); }
    .list-head .spacer { flex: 1; }

    .search-mini {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 34px;
      padding: 0 12px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: var(--bg-soft);
    }
    .search-mini:focus-within { background: var(--bg-elev); box-shadow: 0 0 0 2px var(--accent-glow); }
    .search-mini .icon { width: 14px; height: 14px; color: var(--ink-3); }
    .search-mini input {
      width: 130px;
      border: 0;
      background: none;
      outline: none;
      font-size: 12px;
      color: var(--ink);
    }
    .filter-select {
      height: 34px;
      padding: 0 10px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: var(--bg-soft);
      font-size: 12px;
      color: var(--ink-2);
      outline: none;
    }

    .card-list { display: flex; flex-direction: column; gap: 8px; }
    .card-item {
      display: flex;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--bg-elev);
      transition:
        border-color 0.24s var(--md-ease),
        box-shadow 0.24s var(--md-ease),
        transform 0.14s var(--md-ease);
    }
    .card-item:hover { border-color: var(--line-strong); box-shadow: var(--md-elev-2, var(--shadow-md)); }
    .card-item:active { transform: scale(0.997); }
    .card-item .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .card-item .card-title {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--accent-strong, var(--accent));
      text-transform: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-item .front {
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.45;
      word-break: break-word;
    }
    .card-item .back {
      font-size: 12px;
      color: var(--ink-3);
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    .card-item .meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
    .pill {
      font-size: 9.5px;
      padding: 1px 6px;
      border-radius: 99px;
      background: var(--bg-soft);
      color: var(--ink-3);
    }
    .pill.due { background: rgba(194, 115, 63, 0.14); color: #a55c2c; }
    .pill.new { background: var(--accent-soft); color: var(--accent-ink); }
    .pill.deck { background: var(--bg-soft); color: var(--ink-2); }
    .card-actions { display: flex; gap: 2px; align-items: flex-start; }
    .icon-btn.small { width: 30px; height: 30px; border-radius: 8px; }
    .icon-btn.small .icon { width: 15px; height: 15px; }

    .list-empty {
      padding: 42px 20px;
      text-align: center;
      color: var(--ink-3);
      font-size: 12.5px;
      line-height: 1.8;
    }
    .list-empty .icon { width: 30px; height: 30px; margin: 0 auto 10px; color: var(--line-strong); }

    /* ---------- 编辑器 ---------- */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(12, 14, 13, 0.45);
      backdrop-filter: blur(8px);
      animation: fadeIn 0.16s ease;
    }
    .sheet {
      width: min(560px, 100%);
      max-height: 90dvh;
      overflow-y: auto;
      padding: 20px;
      border-radius: 24px;
      background: var(--bg-elev);
      box-shadow: var(--md-elev-3, var(--shadow-lg));
      animation: popIn 0.2s cubic-bezier(0.2, 0.7, 0.3, 1);
    }
    .sheet h2 { font-size: 17px; margin-bottom: 14px; }
    .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
    .field span { font-size: 11.5px; color: var(--ink-3); }
    .field textarea,
    .field input,
    .field select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--bg);
      color: var(--ink);
      font-size: 13px;
      line-height: 1.6;
      outline: none;
      resize: vertical;
    }
    .field textarea:focus,
    .field input:focus,
    .field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .field textarea.front-input { min-height: 74px; }
    .field textarea.back-input { min-height: 120px; }
    .sheet-actions { display: flex; gap: 8px; align-items: center; margin-top: 16px; }
    .sheet-actions .spacer { flex: 1; }

    /* ---------- 卡片详情 ---------- */
    .card-item { cursor: pointer; }
    .detail-sheet {
      width: min(680px, 100%);
      display: flex;
      flex-direction: column;
      padding: 0;
      overflow: hidden;
    }
    .detail-head {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--line);
    }
    .detail-head > div { flex: 1; min-width: 0; }
    .detail-kicker {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--accent-strong, var(--accent));
      margin-bottom: 6px;
    }
    .detail-meta { display: flex; flex-wrap: wrap; gap: 6px; }
    .detail-body {
      padding: 18px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .detail-section h3 {
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--ink-3);
      margin-bottom: 6px;
    }
    .detail-text {
      font-size: 14px;
      line-height: 1.75;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--ink);
      background: var(--bg-soft);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
    }
    .detail-section:first-child .detail-text { font-weight: 600; }
    .detail-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 20px;
      border-top: 1px solid var(--line);
      background: var(--bg-elev);
    }
    .detail-actions .spacer { flex: 1; }
    @media (max-width: 640px) {
      .detail-sheet { max-height: 86dvh; }
      .detail-head { padding: 16px 16px 12px; }
      .detail-body { padding: 14px 16px; }
      .detail-actions { padding: 12px 16px; flex-wrap: wrap; }
    }

    /* ---------- 复习 ---------- */
    .review-overlay {
      position: fixed;
      inset: 0;
      z-index: 95;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(900px 520px at 50% -10%, var(--accent-glow), transparent 65%),
        color-mix(in srgb, var(--bg) 94%, transparent);
      backdrop-filter: blur(20px);
    }
    .review-top {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: calc(14px + env(safe-area-inset-top)) 20px 10px;
    }
    .review-progress {
      flex: 1;
      height: 5px;
      border-radius: 99px;
      background: var(--line);
      overflow: hidden;
    }
    .review-progress i {
      display: block;
      height: 100%;
      width: 0;
      background: var(--accent);
      border-radius: inherit;
      transition: width 0.3s ease;
    }
    .review-count { font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

    .review-stage {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 10px 20px;
      min-height: 0;
      perspective: 1800px;
    }

    .flip-card {
      width: min(720px, 100%);
      height: min(56vh, 440px);
      cursor: pointer;
      border: 0;
      background: none;
      padding: 0;
    }
    .flip-inner {
      display: block;
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.2, 0.7, 0.3, 1);
    }
    .flip-card.flipped .flip-inner { transform: rotateY(180deg); }

    .flip-face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 28px;
      border-radius: 24px;
      background: var(--bg-elev);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-lg);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow-y: auto;
      text-align: center;
    }
    .flip-face.back {
      transform: rotateY(180deg);
      background:
        radial-gradient(500px 260px at 50% 0%, var(--accent-glow), transparent 70%),
        var(--bg-elev);
    }
    .flip-face .face-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      line-height: 1.5;
      color: var(--ink-3);
      max-width: 100%;
    }
    .flip-face .face-text {
      font-size: clamp(18px, 2.6vw, 27px);
      font-weight: 650;
      line-height: 1.55;
      letter-spacing: -0.01em;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .flip-face.back .face-text { font-weight: 500; font-size: clamp(15px, 2vw, 19px); color: var(--ink); }
    .flip-face .face-tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
    .flip-hint { margin-top: 8px; font-size: 11px; color: var(--ink-3); }

    .review-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 12px 20px calc(20px + env(safe-area-inset-bottom));
      flex-wrap: wrap;
    }
    .grade-btn {
      min-width: 104px;
      height: 50px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--bg-elev);
      color: var(--ink-2);
      font-size: 13px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      transition:
        transform 0.14s var(--md-ease),
        box-shadow 0.24s var(--md-ease),
        background-color 0.24s var(--md-ease),
        border-color 0.24s var(--md-ease);
    }
    .grade-btn small { font-size: 9.5px; font-weight: 500; color: var(--ink-3); }
    .grade-btn:hover { transform: translateY(-1px); box-shadow: var(--md-elev-2, var(--shadow-md)); }
    .grade-btn:active { transform: scale(0.97); }
    .grade-btn[data-grade="again"] { border-color: color-mix(in srgb, #b9442c 35%, var(--line)); color: #b9442c; }
    .grade-btn[data-grade="hard"] { border-color: color-mix(in srgb, #c2733f 35%, var(--line)); color: #a55c2c; }
    .grade-btn[data-grade="good"] { border-color: transparent; background: var(--accent); color: #fff; box-shadow: var(--md-elev-1, var(--shadow-sm)); }
    .grade-btn[data-grade="good"] small { color: rgba(255, 255, 255, 0.75); }

    .review-done {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }
    .review-done h2 { font-size: 24px; margin-bottom: 8px; }
    .review-done p { color: var(--ink-3); font-size: 13px; margin-bottom: 18px; }

    @media (max-width: 900px) {
      .cards-shell { padding: 14px 14px 40px; }
      .cards-grid { grid-template-columns: 1fr; gap: 12px; }
      .decks { position: static; padding: 10px 12px; }
      .deck-list { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
      .deck-item { width: auto; flex: none; padding: 7px 11px; border: 1px solid var(--line); }
      .deck-item .deck-due { display: none; }
      .deck-foot { display: none; }
      .panel-head { padding-bottom: 6px; }
      .top-stats { width: 100%; margin-left: 0; }
      .stat-chip { flex: 1; justify-content: center; }
      .ai-row .ai-actions { margin-left: 0; width: 100%; }
      .ai-actions .btn { flex: 1; }
      .flip-card { height: min(52vh, 380px); }
      .review-actions { gap: 6px; padding: 10px 12px calc(14px + env(safe-area-inset-bottom)); }
      .grade-btn { min-width: 0; flex: 1; height: 46px; }
      .search-mini { flex: 1; }
      .search-mini input { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="cards-shell">
    <header class="cards-top">
      <a class="galaxy-back" href="/" style="display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:99px;background:var(--bg-elev);color:var(--ink-2);font-size:12.5px;text-decoration:none">
        <svg class="icon" style="width:15px;height:15px;transform:rotate(180deg)"><use href="/icons.svg#i-arrow-right"></use></svg>
        返回资源站
      </a>
      <div class="cards-title">
        <h1>记忆卡片</h1>
        <p>粘贴笔记，一键拆分问答；按节奏复习，记得更牢</p>
      </div>
      <div class="top-stats">
        <span class="stat-chip due">待复习 <b id="statDue">0</b></span>
        <span class="stat-chip">全部 <b id="statTotal">0</b></span>
        <span class="stat-chip">已掌握 <b id="statLearned">0</b></span>
      </div>
      <a class="btn ghost" href="/history.html">
        <svg class="icon"><use href="/icons.svg#i-calendar"></use></svg>历史时间轴
      </a>
      <button class="btn primary" id="reviewBtn" type="button">
        <svg class="icon"><use href="/icons.svg#i-sparkles"></use></svg>开始复习
      </button>
      <button class="btn ghost" id="themeBtnCards" type="button">深色</button>
    </header>

    <div class="cards-grid">
      <aside class="panel decks">
        <div class="panel-head"><strong>卡组</strong><span class="deck-count" id="deckTotal"></span></div>
        <div class="deck-list" id="deckList"></div>
        <div class="deck-foot">
          <button type="button" id="newDeckBtn">+ 新建卡组</button>
        </div>
      </aside>

      <section class="main-col">
        <div class="ai-panel">
          <div class="ai-head">
            <svg class="icon" style="color:var(--accent)"><use href="/icons.svg#i-sparkles"></use></svg>
            <div>
              <p class="eyebrow">AI 制卡</p>
              <h2>把内容变成记忆卡片</h2>
            </div>
          </div>
          <textarea class="ai-input" id="sourceText" placeholder="把课堂笔记、错题、概念、公式或一段课文粘贴到这里，AI 会自动拆成问答卡片。也可以直接点「手动添加卡片」自己写。"></textarea>
          <div class="ai-row">
            <label class="mini-field">卡组
              <select id="deckSelect"></select>
            </label>
            <label class="mini-field">数量
              <select id="countSelect">
                <option value="5">5 张</option>
                <option value="8" selected>8 张</option>
                <option value="12">12 张</option>
                <option value="20">20 张</option>
              </select>
            </label>
            <div class="ai-actions">
              <button class="btn ghost" id="manualBtn" type="button">
                <svg class="icon"><use href="/icons.svg#i-plus"></use></svg>手动添加
              </button>
              <button class="btn primary ai-glow" id="generateBtn" type="button">
                <svg class="icon"><use href="/icons.svg#i-sparkles"></use></svg>AI 一键制卡
              </button>
            </div>
          </div>
          <p class="ai-hint" id="aiHint">AI 制卡需要先在资源站「设置」里开启 AI 并填写 API Key。</p>
        </div>

        <div class="panel list-panel">
          <div class="list-head">
            <h2 id="listTitle">全部卡片</h2>
            <span class="count" id="listCount"></span>
            <span class="spacer"></span>
            <label class="search-mini">
              <svg class="icon"><use href="/icons.svg#i-search"></use></svg>
              <input id="searchInput" type="search" placeholder="搜索卡片" autocomplete="off">
            </label>
            <select class="filter-select" id="filterSelect">
              <option value="all">全部</option>
              <option value="due">待复习</option>
              <option value="new">新卡</option>
            </select>
          </div>
          <div class="card-list" id="cardList"></div>
        </div>
      </section>
    </div>
  </div>

  <div id="editorRoot"></div>
  <div id="reviewRoot"></div>
  <div class="toast-root" id="toastRoot" aria-live="polite"></div>

  <script type="module" src="/js/cards.js?v=20261107b"></script>
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      navigator.serviceWorker.register('/service-worker.js', { scope: '/' }).catch(function () {});
    }
  </script>
</body>
</html>
