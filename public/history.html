<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>历史时间轴 · 我的资源站</title>
  <meta name="theme-color" content="#FAF9F6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/js/theme-sync.js"></script>
  <script src="/js/monet.js"></script>
  <link rel="stylesheet" href="/styles.css?v=20261111b">
  <style>
    body.history-body {
      min-height: 100dvh;
      margin: 0;
      overflow-x: hidden;
      background-color: var(--bg);
      background-image:
        radial-gradient(760px 520px at 8% -8%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 62%),
        radial-gradient(700px 520px at 94% 2%, rgba(155, 140, 255, 0.12), transparent 64%);
      background-attachment: fixed;
    }

    .history-shell {
      max-width: 880px;
      margin: 0 auto;
      padding: calc(16px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));
    }

    .history-head { margin-bottom: 16px; }
    .history-top {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 99px;
      background: color-mix(in srgb, var(--bg-elev) 70%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--ink-2);
      font-size: 12.5px;
      text-decoration: none;
    }
    .back-link:hover { color: var(--ink); border-color: var(--line-strong); }
    .back-link .icon { width: 15px; height: 15px; }

    .history-title { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
    .history-title h1 { margin: 0; font-size: 24px; letter-spacing: -0.02em; }
    .history-title p { margin: 0; color: var(--ink-3); font-size: 12.5px; }
    .head-actions { margin-left: auto; display: flex; gap: 8px; }

    .stat-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .stat-pill {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      height: 32px;
      padding: 0 12px;
      border-radius: 99px;
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg-elev) 66%, transparent);
      color: var(--ink-3);
      font-size: 11.5px;
    }
    .stat-pill b {
      color: var(--ink);
      font-size: 15px;
      font-variant-numeric: tabular-nums;
      font-weight: 680;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin: 16px 0 6px;
    }
    .toolbar .search-box {
      flex: 1;
      min-width: 200px;
      height: 38px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: color-mix(in srgb, var(--bg-elev) 70%, transparent);
    }
    .toolbar .search-box .icon { width: 15px; height: 15px; color: var(--ink-3); flex: none; }
    .toolbar .search-box input {
      flex: 1;
      min-width: 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      outline: none;
    }
    .toolbar select {
      height: 38px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: color-mix(in srgb, var(--bg-elev) 70%, transparent);
      color: var(--ink-2);
      font: inherit;
      font-size: 12.5px;
    }

    /* ---------- 时间轴 ---------- */
    .timeline { position: relative; margin-top: 14px; padding-left: 34px; }
    .timeline::before {
      content: "";
      position: absolute;
      left: 11px;
      top: 6px;
      bottom: 6px;
      width: 1px;
      background: linear-gradient(
        to bottom,
        transparent,
        color-mix(in srgb, var(--accent) 40%, var(--line)) 8%,
        color-mix(in srgb, var(--accent) 24%, var(--line)) 92%,
        transparent
      );
    }

    .tl-year {
      position: relative;
      margin: 18px 0 8px;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--accent-ink);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .tl-year:first-child { margin-top: 0; }
    .tl-year::before {
      content: "";
      position: absolute;
      left: -30px;
      top: 50%;
      width: 7px;
      height: 7px;
      margin-top: -3.5px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 14%, transparent);
    }

    .tl-item { position: relative; margin-bottom: 10px; }
    .tl-item::before {
      content: "";
      position: absolute;
      left: -26px;
      top: 20px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--accent) 55%, var(--line-strong));
    }
    .tl-card {
      position: relative;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: color-mix(in srgb, var(--bg-elev) 74%, transparent);
      backdrop-filter: blur(16px) saturate(1.2);
      -webkit-backdrop-filter: blur(16px) saturate(1.2);
      box-shadow: 0 16px 36px -32px rgba(12, 14, 13, 0.6);
      transition: border-color 0.18s ease, transform 0.18s ease;
    }
    .tl-card:hover { border-color: var(--line-strong); transform: translateY(-1px); }
    .tl-time {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 8px;
      border-radius: 6px;
      background: color-mix(in srgb, var(--accent) 11%, transparent);
      color: var(--accent-ink);
      font-size: 11.5px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }
    .tl-card h3 {
      margin: 7px 0 0;
      font-size: 15px;
      line-height: 1.4;
      letter-spacing: -0.01em;
    }
    .tl-card p {
      margin: 5px 0 0;
      color: var(--ink-2);
      font-size: 12.5px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .tl-foot {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .tl-era {
      height: 22px;
      padding: 0 8px;
      border-radius: 99px;
      border: 1px solid var(--line);
      color: var(--ink-3);
      font-size: 10.5px;
      display: inline-flex;
      align-items: center;
    }
    .tl-review {
      height: 22px;
      padding: 0 8px;
      border-radius: 99px;
      font-size: 10.5px;
      display: inline-flex;
      align-items: center;
      background: color-mix(in srgb, var(--accent) 9%, transparent);
      color: var(--accent-ink);
    }
    .tl-review.warn { background: color-mix(in srgb, #e8a33d 14%, transparent); color: #9a6414; }
    .tl-tools { margin-left: auto; display: flex; gap: 2px; opacity: 0.55; transition: opacity 0.16s ease; }
    .tl-card:hover .tl-tools, .tl-card:focus-within .tl-tools { opacity: 1; }
    .tl-tools button {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--ink-3);
    }
    .tl-tools button:hover { background: var(--bg-soft); color: var(--ink); }
    .tl-tools .icon { width: 14px; height: 14px; }

    .empty-state {
      margin-top: 18px;
      padding: 34px 20px;
      border: 1px dashed var(--line-strong);
      border-radius: 18px;
      text-align: center;
      color: var(--ink-3);
      font-size: 13px;
      line-height: 1.8;
    }
    .empty-state b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }

    /* ---------- 编辑弹层 ---------- */
    .sheet-wrap {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(16, 18, 17, 0.38);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      animation: fadeIn 0.18s ease;
    }
    .sheet {
      width: min(520px, 100%);
      max-height: min(86dvh, 720px);
      overflow-y: auto;
      padding: 20px;
      border-radius: 22px;
      border: 1px solid var(--line);
      background: var(--bg-elev);
      box-shadow: 0 40px 90px -40px rgba(12, 14, 13, 0.55);
      animation: sheetIn 0.24s cubic-bezier(0.2, 0.9, 0.25, 1);
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes sheetIn { from { opacity: 0; transform: translateY(14px) scale(0.98); } to { opacity: 1; transform: none; } }
    .sheet h2 { margin: 0 0 14px; font-size: 16px; }
    .sheet .field { display: block; margin-bottom: 12px; }
    .sheet .field > span {
      display: block;
      margin-bottom: 5px;
      color: var(--ink-3);
      font-size: 11.5px;
    }
    .sheet input,
    .sheet textarea {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg);
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      outline: none;
    }
    .sheet textarea { min-height: 92px; resize: vertical; line-height: 1.6; }
    .sheet input:focus, .sheet textarea:focus { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
    .sheet .hint { margin: 5px 0 0; color: var(--ink-3); font-size: 11px; }
    .sheet-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
    }
    .sheet-actions .spacer { flex: 1; }

    /* ---------- 小卡复习 ---------- */
    .review-shell {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter: blur(22px) saturate(1.2);
      -webkit-backdrop-filter: blur(22px) saturate(1.2);
      animation: fadeIn 0.2s ease;
    }
    .review-top {
      position: absolute;
      top: calc(16px + env(safe-area-inset-top));
      left: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .review-progress { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
    .review-bar {
      flex: 1;
      height: 4px;
      border-radius: 99px;
      background: var(--bg-soft);
      overflow: hidden;
    }
    .review-bar i {
      display: block;
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), #9b8cff);
      transition: width 0.3s ease;
    }
    .review-close {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: color-mix(in srgb, var(--bg-elev) 70%, transparent);
      color: var(--ink-2);
    }

    .rev-wrap { width: min(560px, 100%); perspective: 1400px; }
    .rev-card {
      position: relative;
      width: 100%;
      min-height: min(54dvh, 420px);
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.3, 0.9, 0.3, 1);
      cursor: pointer;
    }
    .rev-card.is-flipped { transform: rotateY(180deg); }
    .rev-face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 26px;
      border-radius: 24px;
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg-elev) 82%, transparent);
      box-shadow: 0 34px 80px -46px rgba(12, 14, 13, 0.55);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow-y: auto;
      text-align: center;
    }
    .rev-back { transform: rotateY(180deg); justify-content: center; }
    .rev-time {
      font-size: clamp(30px, 8vw, 44px);
      font-weight: 720;
      letter-spacing: -0.02em;
      color: var(--accent-ink);
      font-variant-numeric: tabular-nums;
    }
    .rev-prompt { color: var(--ink-3); font-size: 13px; }
    .rev-back h3 { margin: 0; font-size: clamp(19px, 4.6vw, 25px); line-height: 1.4; }
    .rev-detail { margin: 0; color: var(--ink-2); font-size: 13.5px; line-height: 1.75; white-space: pre-wrap; }
    .rev-era { font-size: 11px; color: var(--ink-3); }
    .rev-flip {
      height: 30px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 99px;
      background: transparent;
      color: var(--ink-3);
      font: inherit;
      font-size: 11.5px;
    }

    .review-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .review-actions .btn { min-width: 92px; }
    .grade-again { color: #b4472f; border-color: color-mix(in srgb, #b4472f 34%, var(--line)); }
    .grade-hard { color: #9a6414; border-color: color-mix(in srgb, #9a6414 32%, var(--line)); }
    .grade-good {
      color: #0f7a63;
      border-color: color-mix(in srgb, #0f7a63 38%, var(--line));
      background: color-mix(in srgb, #0f7a63 8%, transparent);
    }
    .review-empty { text-align: center; color: var(--ink-2); }
    .review-empty h2 { margin: 0 0 8px; font-size: 20px; color: var(--ink); }
    .review-empty p { margin: 0 0 16px; font-size: 13px; }

    .toast-stack {
      position: fixed;
      left: 50%;
      bottom: calc(26px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 120;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      padding: 9px 14px;
      border-radius: 99px;
      background: color-mix(in srgb, var(--ink) 88%, transparent);
      color: var(--bg);
      font-size: 12.5px;
      animation: toastIn 0.22s ease;
    }
    .toast.error { background: #b4472f; color: #fff; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    @media (max-width: 640px) {
      .history-shell { padding-left: 16px; padding-right: 16px; }
      .history-title h1 { font-size: 21px; }
      .head-actions { width: 100%; margin-left: 0; }
      .head-actions .btn { flex: 1; justify-content: center; }
      .timeline { padding-left: 26px; }
      .timeline::before { left: 7px; }
      .tl-year::before { left: -23px; }
      .tl-item::before { left: -19px; }
      .sheet-wrap { padding: 0; align-items: end; }
      .sheet { width: 100%; max-height: 88dvh; border-radius: 22px 22px 0 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .rev-card { transition: none; }
      .sheet, .sheet-wrap, .review-shell, .toast { animation: none; }
    }
  </style>
</head>
<body class="history-body">
  <div class="history-shell">
    <header class="history-head">
      <div class="history-top">
        <a class="back-link" href="/cards.html">
          <svg class="icon"><use href="/icons.svg#i-cards"></use></svg>
          记忆卡片
        </a>
        <div class="history-title">
          <h1>历史时间轴</h1>
          <p>把历史大事按时间串起来，再用小卡过一遍</p>
        </div>
        <div class="head-actions">
          <button class="btn ghost" id="reviewBtn" type="button">
            <svg class="icon"><use href="/icons.svg#i-cards"></use></svg>
            小卡复习
          </button>
          <button class="btn primary" id="addBtn" type="button">
            <svg class="icon"><use href="/icons.svg#i-plus"></use></svg>
            记录大事
          </button>
        </div>
      </div>
      <div class="stat-row" id="statRow"></div>
    </header>

    <div class="toolbar">
      <label class="search-box">
        <svg class="icon"><use href="/icons.svg#i-search"></use></svg>
        <input id="searchInput" type="search" placeholder="搜索时间、事件或时期…" autocomplete="off" aria-label="搜索历史事件">
      </label>
      <select id="eraSelect" aria-label="按期筛选">
        <option value="all">全部时期</option>
      </select>
    </div>

    <section class="timeline" id="timeline" aria-label="历史时间轴"></section>
  </div>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <div id="sheetRoot"></div>
  <div id="reviewRoot"></div>

  <script type="module" src="/js/history.js?v=20261111a"></script>
</body>
</html>
